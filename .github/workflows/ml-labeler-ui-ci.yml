name: Manual blueprint labeler browser checks

on:
  pull_request:
    paths:
      - 'ml/symbol-detector/annotator/**'
      - 'ml/symbol-detector/tests/test_annotator_browser.py'
      - 'ml/symbol-detector/tests/test_annotator_web.py'
      - 'ml/symbol-detector/tests/test_annotator_improvements.py'
      - 'ml/symbol-detector/tests/test_annotator_access_and_documents.py'
      - 'ml/symbol-detector/tests/test_annotator_long_documents.py'
      - 'ml/symbol-detector/tests/test_label_store_devices_layout.py'
      - 'ml/symbol-detector/tests/test_document_labels.py'
      - 'ml/symbol-detector/tests/test_device_classes_unified.py'
      - 'ml/symbol-detector/scripts_unify_labels.py'
      - 'ml/symbol-detector/scripts_circuitnet_review_sheets.py'
      - 'ml/symbol-detector/scripts_prepare_training_data.py'
      - 'ml/symbol-detector/blueprint_symbols/label_schema.py'
      - 'ml/symbol-detector/blueprint_symbols/dataset_manifest.py'
      - 'ml/symbol-detector/annotator/label_store.py'
      - 'ml/symbol-detector/remote/sync.sh'
      - 'ml/symbol-detector/scripts_migrate_label_store.py'
      - '.github/workflows/ml-labeler-ui-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-labeler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: PDF labeler / real Chromium smoke
    # Playwright 1.56 browser dependency installer supports Ubuntu 24.04;
    # GitHub's moving ubuntu-latest has already moved to Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/symbol-detector/requirements-test.txt
      - name: Install light browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/symbol-detector/requirements-test.txt 'playwright==1.56.0'
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            python -m playwright install chromium
          fi
      - name: Verify manual labeling browser and HTTP contract
        working-directory: ml/symbol-detector
        run: >-
          python -m pytest -q tests/test_annotator_browser.py tests/test_annotator_web.py
          tests/test_annotator_improvements.py tests/test_annotator_access_and_documents.py
          tests/test_annotator_long_documents.py tests/test_label_store_devices_layout.py
          tests/test_document_labels.py tests/test_device_classes_unified.py
