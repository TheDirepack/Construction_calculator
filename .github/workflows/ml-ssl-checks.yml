name: Blueprint SSL regression checks

on:
  pull_request:
    paths:
      - "ml/symbol-detector/**"
      - ".github/workflows/ml-ssl-checks.yml"
  push:
    branches: [main]
    paths:
      - "ml/symbol-detector/**"
      - ".github/workflows/ml-ssl-checks.yml"

jobs:
  ssl-cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ml/symbol-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.216"
      - name: Check import/compile syntax
        run: python -m compileall -q blueprint_symbols adapters tests scripts_pretrain_ssl.py scripts_train_ultralytics.py scripts_verify_ssl_transfer.py scripts_preview_pretrain_ssl.py
      - name: Validate training launchers' shell syntax
        run: bash -n remote/run_pretrain_v3.sh remote/run_phase2_train.sh
      - name: Run all ML regression tests
        run: python -m pytest -q tests
