name: Blueprint SSL regression checks

on:
  pull_request:
    paths:
      - "ml/symbol-detector/**"
      - ".github/workflows/ml-ssl-checks.yml"
  push:
    branches: [main]
    paths:
      - "ml/symbol-detector/**"
      - ".github/workflows/ml-ssl-checks.yml"

jobs:
  ssl-cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ml/symbol-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.216"
      - name: Require torch (never silently skip SSL tests)
        run: python -c "import torch; print('torch', torch.__version__)"
      - name: Run SSL and compositor regressions
        run: |
          python -m pytest -q             tests/test_ssl_pretrain.py             tests/test_ssl_transfer.py             tests/test_neca_svg_compositor.py
